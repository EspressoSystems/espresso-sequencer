[project]
name = "claude-gh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.172",
    "githubkit>=0.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[project.scripts]
claude-gh = "claude_gh:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["claude_gh.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout 5 --durations 10"
