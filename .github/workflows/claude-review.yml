name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # resolveReviewThread is refused with contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Remove project instructions
        run: rm -f CLAUDE.md AGENTS.md

      - name: Fetch team review comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./tmp
          scripts/fetch-pr-team-comments \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${{ github.event.pull_request.number }}" \
            > ./tmp/pr-review-comments.json

      - name: Prepare backport context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Backport PRs use the branch name backport-<original>-to-<target>,
          # created by both scripts/backport-dispatch and korthout/backport-action.
          if [[ ! "$HEAD_REF" =~ ^backport-([0-9]+)-to- ]]; then
            echo "not a backport branch ($HEAD_REF); skipping"
            exit 0
          fi
          orig="${BASH_REMATCH[1]}"
          echo "$orig" > ./tmp/is-backport
          scripts/fetch-pr-team-comments "$OWNER" "$REPO" "$orig" \
            > ./tmp/original-pr-comments.json
          gh pr diff "$orig" > ./tmp/original.diff
          gh pr diff "$PR_NUMBER" > ./tmp/backport.diff

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - name: Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        # Read from PR head, so PR-author controllable (scripts/claude-gh and .github/claude/*).
        # Fine: fork PRs need manual approval to run, and Claude only adds advisory review,
        # never approves/merges.
        run: uv run scripts/claude-gh review
