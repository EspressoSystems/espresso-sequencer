name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# run holds ANTHROPIC_API_KEY and a read token and only records actions; start and apply hold the
# write token and never run Claude. All three use the PR checkout, so scripts/claude-gh is
# PR-author controllable. Fine: fork PRs need approval and get read-only tokens.
jobs:
  start:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      comment-id: ${{ steps.start.outputs.comment-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/claude-gh
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - name: Post status comment
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(uv run scripts/claude-gh start review)
          echo "comment-id=$id" >> "$GITHUB_OUTPUT"

  run:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Remove project instructions
        run: rm -f CLAUDE.md AGENTS.md

      - name: Fetch team review comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./tmp
          scripts/fetch-pr-team-comments \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${{ github.event.pull_request.number }}" \
            > ./tmp/pr-review-comments.json

      - name: Prepare backport context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Backport PRs use the branch name backport-<original>-to-<target>,
          # created by both scripts/backport-dispatch and korthout/backport-action.
          if [[ ! "$HEAD_REF" =~ ^backport-([0-9]+)-to- ]]; then
            echo "not a backport branch ($HEAD_REF); skipping"
            exit 0
          fi
          orig="${BASH_REMATCH[1]}"
          echo "$orig" > ./tmp/is-backport
          scripts/fetch-pr-team-comments "$OWNER" "$REPO" "$orig" \
            > ./tmp/original-pr-comments.json
          gh pr diff "$orig" > ./tmp/original.diff
          gh pr diff "$PR_NUMBER" > ./tmp/backport.diff

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - name: Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: uv run scripts/claude-gh run review

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          overwrite: true
          name: claude-actions-review
          path: tmp/actions.json
          retention-days: 7
          if-no-files-found: ignore

  apply:
    needs: [start, run]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # resolveReviewThread is refused with contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/claude-gh
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - uses: actions/download-artifact@v8
        continue-on-error: true # missing when run failed before writing the record
        with:
          name: claude-actions-review
          path: tmp/actions

      - name: Apply actions
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ID: ${{ needs.start.outputs.comment-id }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          uv run scripts/claude-gh apply review \
            --status-id "$STATUS_ID" --run-result "$RUN_RESULT" \
            --record tmp/actions/actions.json
