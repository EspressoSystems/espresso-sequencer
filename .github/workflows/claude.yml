name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - name: Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: uv run scripts/claude-gh mention

  # `/code-review [low|medium|high|xhigh|max] [opus|sonnet|haiku|fable|claude-<id>]` on a PR runs
  # the built-in Claude Code review. Defaults: high, opus.
  code-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/code-review') &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    concurrency:
      group: code-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Parse arguments
        id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          effort=high
          model=opus
          read -r -a words <<< "$(head -n1 <<< "$BODY" | tr -d '\r')"
          if [[ "${words[0]}" != /code-review ]]; then
            echo "::error::expected /code-review, got ${words[0]}"
            exit 1
          fi
          for w in "${words[@]:1}"; do
            if [[ "$w" =~ ^(low|medium|high|xhigh|max)$ ]]; then
              effort=$w
            elif [[ "$w" =~ ^(opus|sonnet|haiku|fable|claude-[a-z0-9.-]+)$ ]]; then
              model=$w
            else
              echo "::error::unknown /code-review argument: $w"
              exit 1
            fi
          done
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: scripts/claude-gh

      - name: Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EFFORT: ${{ steps.args.outputs.effort }}
          MODEL: ${{ steps.args.outputs.model }}
        run: uv run scripts/claude-gh code-review --model "$MODEL" --effort "$EFFORT"
