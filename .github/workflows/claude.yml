name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          # The action stops at the first result, so background subagents leave the reply unposted.
          # https://github.com/anthropics/claude-code-action/issues/1499
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model opus --max-turns 120"

  # `/code-review [low|medium|high|xhigh|max] [opus|sonnet|haiku|fable|claude-<id>]` on a PR runs
  # the built-in Claude Code review. Defaults: high, opus.
  code-review:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/code-review') &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    concurrency:
      group: code-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse arguments
        id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          effort=high
          model=opus
          read -r -a words <<< "$(head -n1 <<< "$BODY" | tr -d '\r')"
          if [[ "${words[0]}" != /code-review ]]; then
            echo "::error::expected /code-review, got ${words[0]}"
            exit 1
          fi
          for w in "${words[@]:1}"; do
            if [[ "$w" =~ ^(low|medium|high|xhigh|max)$ ]]; then
              effort=$w
            elif [[ "$w" =~ ^(opus|sonnet|haiku|fable|claude-[a-z0-9.-]+)$ ]]; then
              model=$w
            else
              echo "::error::unknown /code-review argument: $w"
              exit 1
            fi
          done
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # https://github.com/anthropics/claude-code-action/issues/1499
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: /code-review ${{ steps.args.outputs.effort }} --comment ${{ github.event.issue.number }}
          claude_args: |
            --model ${{ steps.args.outputs.model }} --max-turns 120 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
